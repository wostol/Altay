<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fdf6e3"/>
      <stop offset="1" stop-color="#f7edd2"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2"/>
    </filter>
  </defs>

  <!-- фон -->
  <rect width="1440" height="820" fill="url(#sky)"/>

  <!-- растительность (жёлтое/зелёное на картах БО) -->
  <path d="M0 560 Q220 470 420 540 T900 520 T1440 570 V820 H0 Z" fill="#e8f0d8" opacity="0.9"/>
  <path d="M0 660 Q300 590 640 650 T1440 640 V820 H0 Z" fill="#dcebc6" opacity="0.9"/>
  <ellipse cx="1150" cy="220" rx="260" ry="150" fill="#f2e9c8" opacity="0.75"/>
  <ellipse cx="220" cy="180" rx="230" ry="130" fill="#f2e9c8" opacity="0.6"/>

  <!-- озеро / болото -->
  <path d="M980 640 q60 -60 150 -40 q90 20 70 80 q-20 60 -120 55 q-120 -5 -100 -95 Z" fill="#bfe3f0" stroke="#7fc4de" stroke-width="3"/>
  <path d="M1010 660 h30 M1070 690 h34 M1120 655 h26" stroke="#7fc4de" stroke-width="3" stroke-linecap="round"/>

  <!-- дороги -->
  <path d="M-20 300 C300 260 520 380 760 340 S1200 200 1460 260" fill="none" stroke="#ffffff" stroke-width="14"/>
  <path d="M-20 300 C300 260 520 380 760 340 S1200 200 1460 260" fill="none" stroke="#c94f3d" stroke-width="8"/>
  <path d="M420 820 C460 620 560 520 540 300 S620 60 700 -20" fill="none" stroke="#ffffff" stroke-width="10"/>
  <path d="M420 820 C460 620 560 520 540 300" fill="none" stroke="#8a8a8a" stroke-width="4" stroke-dasharray="14 10"/>

  <!-- изогипсы (рельеф) -->
  <g fill="none" stroke="#d9a066" stroke-width="2.2" opacity="0.85">
    <path d="M180 470 q120 -110 260 -60 q140 50 90 170 q-50 110 -210 90 q-160 -20 -140 -200 Z"/>
    <path d="M215 470 q100 -85 215 -45 q115 40 72 138 q-42 90 -172 72 q-130 -18 -115 -165 Z"/>
    <path d="M250 468 q80 -62 170 -30 q90 32 56 108 q-34 72 -134 56 q-100 -16 -92 -134 Z"/>
    <path d="M285 465 q58 -40 122 -18 q64 22 40 76 q-24 50 -96 38 q-72 -12 -66 -96 Z"/>
    <path d="M900 160 q130 -70 250 10 q110 76 30 170 q-90 90 -220 30 q-130 -60 -60 -210 Z"/>
    <path d="M935 172 q105 -55 200 8 q88 60 22 134 q-70 70 -172 22 q-102 -46 -50 -164 Z"/>
    <path d="M972 186 q80 -40 150 6 q66 44 16 100 q-52 52 -128 16 q-76 -34 -38 -122 Z"/>
  </g>

  <!-- каменистая гряда -->
  <g fill="#5b5b5b">
    <circle cx="760" cy="560" r="5"/><circle cx="782" cy="572" r="4"/><circle cx="802" cy="558" r="5"/>
    <circle cx="824" cy="574" r="4"/><circle cx="846" cy="560" r="5"/><circle cx="868" cy="576" r="4"/>
  </g>

  <!-- ручей -->
  <path d="M120 40 q120 140 60 260 q-60 120 90 200" fill="none" stroke="#7fc4de" stroke-width="5" stroke-linecap="round"/>

  <!-- трасса ориентирования -->
  <g filter="url(#soft)" opacity="0.35">
    <path d="M140 700 L330 520 L560 610 L740 400 L960 470 L1150 300 L1330 380" fill="none" stroke="#c94f3d" stroke-width="10"/>
  </g>
  <path d="M140 700 L330 520 L560 610 L740 400 L960 470 L1150 300 L1330 380" fill="none" stroke="#c94f3d" stroke-width="5"/>

  <!-- контрольные пункты -->
  <g fill="none" stroke="#c94f3d" stroke-width="5">
    <circle cx="140" cy="700" r="26"/>
    <circle cx="330" cy="520" r="20"/>
    <circle cx="560" cy="610" r="20"/>
    <circle cx="740" cy="400" r="20"/>
    <circle cx="960" cy="470" r="20"/>
    <circle cx="1150" cy="300" r="20"/>
  </g>
  <!-- старт (треугольник) и финиш (двойной круг) -->
  <path d="M1310 352 l34 56 h-68 Z" fill="none" stroke="#c94f3d" stroke-width="5"/>
  <circle cx="1330" cy="380" r="20" fill="none" stroke="#c94f3d" stroke-width="4"/>
  <circle cx="1330" cy="380" r="27" fill="none" stroke="#c94f3d" stroke-width="4"/>

  <!-- номера КП -->
  <g font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#a53a28">
    <text x="344" y="508">2</text>
    <text x="574" y="598">3</text>
    <text x="754" y="388">4</text>
    <text x="974" y="458">5</text>
    <text x="1164" y="288">6</text>
  </g>

  <!-- компасная стрелка -->
  <g transform="translate(1355 90)">
    <line x1="0" y1="40" x2="0" y2="-40" stroke="#333" stroke-width="4"/>
    <path d="M0 -40 l-10 22 h20 Z" fill="#333"/>
    <text x="-8" y="-52" font-family="Arial" font-size="30" font-weight="bold" fill="#333">N</text>
  </g>

  <!-- сетка координат -->
  <g stroke="#c94f3d" stroke-width="1" opacity="0.18">
    <path d="M180 0 V820 M540 0 V820 M900 0 V820 M1260 0 V820"/>
    <path d="M0 140 H1440 M0 420 H1440 M0 700 H1440"/>
  </g>

  <!-- масштабы -->
  <g font-family="Arial" font-size="18" fill="#8a7a55">
    <text x="40" y="800">1:10 000 · ~2.5 мин/км</text>
    <text x="1180" y="800">Томь · 2026</text>
  </g>
</svg>
